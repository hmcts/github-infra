trigger:
  batch: true
  branches:
    include:
      - main

pr:
  - main

schedules:
  - cron: "0 18 * * 1-5"
    displayName: Daily 6pm build
    branches:
      include:
        - main
    always: "true"

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: "hmcts"

parameters:
  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy
  - name: environment_components
    type: object
    default:
      - deployment: "sandbox_github_network"
        environment: "sbox"
        component: "network"
        service_connection: "HMCTS-HUB-SBOX-INTSVC-WIF"
        dependsOn: "Precheck"
      - deployment: "nonprod_github_network"
        environment: "stg"
        component: "network"
        service_connection: "HMCTS-HUB-NONPROD-INTSVC-WIF"
        dependsOn: "sandbox_github_network"
      - deployment: "prod_github_network"
        environment: "prod"
        component: "network"
        service_connection: "HMCTS-HUB-PROD-INTSVC-WIF"
        dependsOn: "nonprod_github_network"

variables:
  - name: timeoutInMinutes
    value: 60
  - name: agentImage
    value: ubuntu-latest
  - name: product
    value: hub
  - name: terraformInitSubscription
    value: 04d27a32-7a07-48b3-95b8-3c8691e1a263
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries

stages:
  - stage: Precheck
    jobs:
      - job:
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: "infra-vault-nonprod"
              keyvaultSecret: "azure-devops-sp-token"
              serviceConnection: "azurerm-sandbox"
              overrideAction: ${{ parameters.overrideAction }}

  - ${{ each deployment in parameters.environment_components }}:
    - stage: ${{ deployment.deployment }}
      dependsOn: ${{ deployment.dependsOn }}
      jobs:
        - job: TerraformPlanApply
          pool: hmcts-cftptl-agent-pool
          timeoutInMinutes: ${{ variables.timeoutInMinutes }}
          steps:
            - template: steps/terraform.yaml@cnp-azuredevops-libraries
              parameters:
                overrideAction: ${{ parameters.overrideAction }}
                environment: ${{ deployment.environment}}
                component: ${{ deployment.component }}
                serviceConnection: ${{ deployment.service_connection }}
                product: ${{ variables.product }}
                terraformInitSubscription: ${{ variables.terraformInitSubscription }}
                # Workaround to an issue with azapi provider and WIF-based Service Connection on our AKS agents
                # This flag enables the fallback to generate ID token for azapi provider when using WIF-based Service Connection on AKS agents
                # OIDC Token is the first credential in the chain used by azapi so it will always be tried first
                # Meanwhile, the OIDC Request/refresh token credential is tried after file-token OIDC credentials and only if they haven't been set
                # On AKS agent where we have Workload Identity credentials injected these will always be set
                # This causes azapi to always try and use Workload Identity credentials instead of the correct ADO credentials and always fail authentication to Entra.
                # The downside to this workaround is that this token is issued at the start of this stage and never refreshed so there is a risk of random timeouts occurring during long-running operations.
                # Link to Issue on azapi Provider GitHub: https://github.com/Azure/terraform-provider-azapi/issues/1264
                fallbackGenerateIdToken: true
